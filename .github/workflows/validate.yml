name: Validate TodayUK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/database.test.mjs
      - run: node tests/discovery.test.mjs
      - run: node tests/feed.test.mjs
      - run: node tests/editorial.test.mjs
      - run: node tests/wordpress.test.mjs
      - run: node tests/publishing.test.mjs
      - run: node tests/publish-flow.test.mjs
      - run: node tests/article-length.test.mjs
      - run: node tests/content-crm.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: todayuk-build
          path: dist/
          include-hidden-files: true
          retention-days: 3
