name: Validate TodayUK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: php -l wordpress/todayuk-engagement/todayuk-engagement.php && php -l wordpress/todayuk-engagement/catalog.php && php -l wordpress/todayuk-engagement/readers.php && php -l wordpress/todayuk-engagement/reader-model.php && php tests/engagement.php && php tests/readers.php && php -l wordpress/todayuk-engagement/community.php && php -l wordpress/todayuk-engagement/community-model.php && php -l wordpress/todayuk-engagement/quiz.php && php tests/community.php && php -l wordpress/todayuk-engagement/launch.php && php -l wordpress/todayuk-engagement/launch-model.php && php tests/launch.php
      - run: find wordpress/todayuk -name "*.php" -print0 | xargs -0 -n1 php -l
      - run: node --check wordpress/todayuk/assets/home.js && node --check wordpress/todayuk-engagement/gam.js
      - run: node tests/database.test.mjs
      - run: node tests/discovery.test.mjs
      - run: node tests/feed.test.mjs
      - run: node tests/editorial.test.mjs
      - run: node tests/wordpress.test.mjs
      - run: node tests/publishing.test.mjs
      - run: node tests/publish-flow.test.mjs
      - run: node tests/article-length.test.mjs
      - run: node tests/content-crm.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: todayuk-build
          path: dist/
          include-hidden-files: true
          retention-days: 3
